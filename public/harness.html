<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.7" />
  <title>LC-rs2 r377 harness</title>
  <!--
    Layout + CSS class names mirror rs2b0t public-bot/bot.html so a full
    BotPanel port later is mostly drop-in. Fence: harness page only.
  -->
  <style>
    body, td, p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: white;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }

    #rs2b0t-root {
      display: flex;
      align-items: stretch;
      gap: 8px;
      height: 100vh;
      box-sizing: border-box;
    }

    #game-wrap {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      gap: 6px;
    }

    .banner {
      color: #8f8;
      margin: 0;
      flex: 0 0 auto;
    }
    .banner a { color: #6cf; }

    #game-stage {
      position: relative;
      width: 765px;
      height: 503px;
      flex: 0 0 auto;
    }

    #game-stage canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      outline: none;
      /* Nearest-neighbor upscale (LC client “Pixel Scaling”) — all browsers */
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* ---- bot panel (rs2b0t names) ---- */

    #bot-panel {
      width: 330px;
      flex: 0 0 330px;
      height: 100vh;
      /* Flex column: header fixed, log largest, inv/chat split rest */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      background: #111;
      border-left: 1px solid #333;
      padding: 10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #ddd;
    }

    .rs2b0t-title {
      font-weight: bold;
      font-size: 14px;
      color: #04A800;
      margin-bottom: 8px;
      flex: 0 0 auto;
    }

    .rs2b0t-wall-link {
      color: #04A800;
      text-decoration: none;
    }

    .rs2b0t-section {
      margin-bottom: 8px;
      min-height: 0;
    }

    .rs2b0t-section-fixed {
      flex: 0 0 auto;
    }

    /* Log takes the bulk of remaining height */
    .rs2b0t-section-log {
      flex: 2 1 0;
      display: flex;
      flex-direction: column;
      min-height: 120px;
      margin-bottom: 6px;
    }

    .rs2b0t-section-log .rs2b0t-log {
      flex: 1 1 auto;
      min-height: 0;
      height: auto; /* override fixed height */
    }

    /* Bottom stack: inv + chat split leftover space evenly */
    .rs2b0t-bottom {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rs2b0t-section-grow {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 0;
    }

    .rs2b0t-section-grow .rs2b0t-inv,
    .rs2b0t-section-grow .rs2b0t-chat {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
    }

    .rs2b0t-section-title {
      color: #888;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 4px;
      padding-bottom: 2px;
      flex: 0 0 auto;
    }

    .rs2b0t-row {
      display: flex;
      justify-content: space-between;
      line-height: 1.6;
      gap: 8px;
    }

    .rs2b0t-key {
      color: #777;
      flex: 0 0 auto;
    }

    .rs2b0t-value {
      color: #ddd;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .rs2b0t-dim {
      color: #555;
    }

    .rs2b0t-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .rs2b0t-button {
      flex: 1;
      min-width: 4.5em;
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 4px 0;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .rs2b0t-button:hover:not(:disabled) {
      background: #252525;
      border-color: #04A800;
    }

    .rs2b0t-button:disabled {
      color: #555;
      cursor: default;
    }

    .rs2b0t-current-script {
      color: #7ad0ff;
      font-size: 12px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- modals (rs2b0t ParamsModal / script-config shape) ---- */
    .rs2b0t-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .rs2b0t-modal {
      width: min(420px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(17, 17, 17, 0.97);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .rs2b0t-walk-modal {
      width: min(440px, 92vw);
    }

    .rs2b0t-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .rs2b0t-modal-title {
      font-size: 15px;
      font-weight: bold;
      color: #04A800;
    }

    .rs2b0t-modal-footer {
      flex: 0 0 auto;
      border-top: 1px solid #2a2a2a;
      padding-top: 10px;
    }

    .rs2b0t-params-body {
      padding: 4px 0 4px;
      max-height: 60vh;
      overflow: auto;
      min-height: 0;
    }

    .rs2b0t-param-row {
      padding: 10px 2px;
      border-bottom: 1px solid #23282f;
    }

    .rs2b0t-param-row:last-child {
      border-bottom: 0;
    }

    .rs2b0t-param-label {
      font: 600 12px ui-sans-serif, system-ui, sans-serif;
      color: #cdd3da;
    }

    .rs2b0t-param-help {
      font: 11px ui-sans-serif, system-ui, sans-serif;
      color: #7d8590;
      margin-top: 1px;
    }

    .rs2b0t-param-control {
      margin-top: 8px;
    }

    .rs2b0t-param-text,
    .rs2b0t-param-select,
    .rs2b0t-param-num,
    .rs2b0t-param-tilein {
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 4px 6px;
      font: 12px ui-monospace, Menlo, monospace;
      box-sizing: border-box;
    }

    .rs2b0t-param-select {
      width: 100%;
    }

    .rs2b0t-param-num {
      width: 60px;
      text-align: center;
    }

    .rs2b0t-ctl-tile {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rs2b0t-param-tilef {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font: 11px ui-monospace, Menlo, monospace;
      color: #7d8590;
    }

    .rs2b0t-param-tilein {
      width: 72px;
    }

    .rs2b0t-state-running {
      color: #5be05b;
    }

    .rs2b0t-state-paused {
      color: #e0d75b;
    }

    .rs2b0t-inv,
    .rs2b0t-chat,
    .rs2b0t-log {
      overflow-y: auto;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 4px;
      font-size: 11px;
    }

    .rs2b0t-inv-line,
    .rs2b0t-chat-line {
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      color: #ccc;
    }

    .rs2b0t-chat-game {
      color: #75a9a9;
    }

    .rs2b0t-chat-public {
      color: #ddd;
    }

    .rs2b0t-chat-private {
      color: #5be0e0;
    }

    .rs2b0t-log {
      /* height comes from flex parent; keep a fallback if used alone */
      min-height: 80px;
    }

    .rs2b0t-log-line {
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .rs2b0t-log-warn {
      color: #e0d75b;
    }

    .rs2b0t-log-error {
      color: #ff7b7b;
    }
  </style>
</head>
<body>
  <div id="rs2b0t-root">
    <div id="game-wrap">
      <p class="banner">
        Harness client (stock Client + adapter). Pure play:
        <a href="/rs2.html">rs2.html</a>
      </p>
      <div id="game-stage">
        <canvas id="canvas" width="765" height="503">
          Your browser is not capable of running our web client.
        </canvas>
      </div>
    </div>
    <div id="bot-panel"></div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.fillStyle = 'black';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'white';
          ctx.font = 'bold 20px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Loading…', canvas.width / 2, canvas.height / 2);
        }
      }
      // Fit game stage into left pane (rs2b0t bot.html fit())
      const wrap = document.getElementById('game-wrap');
      const stage = document.getElementById('game-stage');
      function fit() {
        if (!wrap || !stage) return;
        const w = wrap.clientWidth;
        const h = wrap.clientHeight - 28;
        if (w <= 0 || h <= 0) return;
        const scale = Math.min(w / 765, h / 503, 1.25);
        stage.style.width = Math.floor(765 * scale) + 'px';
        stage.style.height = Math.floor(503 * scale) + 'px';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
  <script type="module">
    await import('/harness/harness-client.js?v=navhop1');
  </script>
</body>
</html>
